name: release
# 릴리스 만드는 법 (둘 중 하나):
#   1) 태그를 올린다:  git tag vX.Y.Z && git push origin vX.Y.Z
#   2) Actions 탭 → release → Run workflow (태그는 이 작업이 만든다)
# 어느 쪽이든 태그가 asmr_mp3.sh 의 VERSION 과 같아야 한다.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Work out the tag and check it against VERSION
        run: |
          v="$(grep -m1 '^VERSION=' asmr_mp3.sh | cut -d'"' -f2)"
          if [ "$GITHUB_REF_TYPE" = tag ]; then tag="$GITHUB_REF_NAME"; else tag="v$v"; fi
          [ "$tag" = "v$v" ] || { echo "tag $tag != VERSION v$v"; exit 1; }
          echo "TAG=$tag" >> "$GITHUB_ENV"
      - name: Notes from CHANGELOG
        run: |
          awk -v t="## $TAG " 'index($0,t)==1 {f=1; next} /^## / {f=0} f' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Release $TAG" > notes.md
      - name: Create release (and the tag, if it does not exist yet)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then echo "release $TAG already exists"; exit 1; fi
          gh release create "$TAG" asmr_mp3.sh --title "$TAG" --notes-file notes.md --target "$GITHUB_SHA"
