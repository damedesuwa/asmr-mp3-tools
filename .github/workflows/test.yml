name: test
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg and mutagen
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install mutagen
      - name: Run tests
        run: bash tests/run.sh
